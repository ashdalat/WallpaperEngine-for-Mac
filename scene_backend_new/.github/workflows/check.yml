name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install format dependencies
        run: |
          python3 -m pip install --user clang-format==22.1.5

      - name: Check formatting
        uses: hypengw/lito-action@v0.1.0
        with:
          command: format-check
