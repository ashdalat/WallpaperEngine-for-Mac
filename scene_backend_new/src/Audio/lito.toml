[package]
name = "owe-audio"
version.workspace = true

[lib]
name = "owe-audio"
module = "owe.audio_response"
archive = "owe-audio-response"
sources = [
  "AudioResponse.cppm",
  "AudioResponse.cpp",
]

[usage]
options = [
  "-Wextra",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]

[dependencies.owe-core]
workspace = true
pub = true

[dependencies.rstd-std]
workspace = true
pub = true
